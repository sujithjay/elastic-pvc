apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elastic-pvc.fullname" . }}
  labels:
    {{- include "elastic-pvc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "elastic-pvc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elastic-pvc.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "elastic-pvc.serviceAccountName" . }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --interval={{ .Values.controller.interval }}
            - --max-resizes-per-cycle={{ .Values.controller.maxResizesPerCycle }}
            - --resize-cooldown={{ .Values.controller.cooldown }}
            - --metrics-addr=:8080
            - --health-addr=:8081
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
